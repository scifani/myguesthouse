# Copy this file to config.yaml and fill in your details.

# Text fields (tagline, description, etc.) accept either a plain string (single
# language) or a per-language dict. Supported language codes: it, en.
# Example multilingual field:
#   description:
#     it: "Una bella proprietà..."
#     en: "A beautiful property..."

property:
  name: "My Guesthouse"
  tagline:
    it: "La tua casa lontano da casa"
    en: "Your home away from home"
  description:
    it: >
      Una breve descrizione della proprietà mostrata sul sito pubblico.
    en: >
      A short description of your property shown on the public website.
  location:
    address: "City, Region, Country"
    description:
      it: >
        Qualche frase sulla posizione: attrazioni vicine, come raggiungerci, ecc.
      en: >
        A few sentences about your location: nearby attractions, how to get there, etc.
    google_maps_embed_url: ""   # Paste the src URL from Google Maps > Share > Embed a map

contact:
  phone: "+39 000 0000000"
  email: "info@example.com"
  whatsapp: "+39 000 0000000"   # leave empty to hide the WhatsApp button

branding:
  primary_color: "#0d6efd"    # any CSS color value

# Apartments are managed via the admin UI (/admin) and stored in the database.
# Name, description, size, max guests, features, images, and AlloggiatiWeb
# credentials are all configured there — not in this file.
