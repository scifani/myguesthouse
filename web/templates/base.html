<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ site.property.name | default('MyGuestHouse') }}{% endblock %}</title>

  <!-- Fonts & Icons -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Open+Sans:300,400,600,700&display=swap">
  <link rel="stylesheet" href="{{ url_for('static', filename='assets/css/nucleo-icons.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='assets/css/nucleo-svg.css') }}">

  <!-- Soft UI Design System -->
  <link rel="stylesheet" href="{{ url_for('static', filename='assets/css/soft-design-system.min.css') }}">

  <!-- Brand colour overrides -->
  <style>
    {% set brand = site.branding.primary_color | default('#4a7c59') %}
    :root { --brand: {{ brand }}; }
    .bg-gradient-primary,
    .mask.bg-gradient-primary {
      background-image: linear-gradient(195deg,
        color-mix(in srgb, {{ brand }} 65%, white) 0%,
        {{ brand }} 100%) !important;
    }
    .text-gradient.text-primary {
      background-image: linear-gradient(195deg,
        color-mix(in srgb, {{ brand }} 65%, white) 0%,
        {{ brand }} 100%) !important;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .btn.bg-gradient-primary {
      background-image: linear-gradient(195deg,
        color-mix(in srgb, {{ brand }} 65%, white) 0%,
        {{ brand }} 100%) !important;
      border: none;
      box-shadow: 0 4px 7px -1px rgba(0,0,0,.11), 0 2px 4px -1px rgba(0,0,0,.07);
    }
    .btn.bg-gradient-primary:hover {
      box-shadow: 0 3px 5px -1px rgba(0,0,0,.09), 0 2px 3px -1px rgba(0,0,0,.07);
    }
    /* nav top line on active link */
    .navbar-nav .nav-link.active::before,
    .navbar-nav .nav-link:hover::before {
      background-color: {{ brand }} !important;
    }
  </style>

  {% block head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">

{% block body %}{% endblock %}

<!-- Bootstrap JS bundle (popper included) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', filename='assets/js/soft-design-system.min.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
